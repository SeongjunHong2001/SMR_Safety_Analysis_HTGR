# =====================================================================
# S0 정격 정상상태 시나리오 (Role 1)
# =====================================================================
# 출처: 「[1] 기준 설계와 계통 구성 조사 보고서」 판 1.0 (담당 1, 2026-11-26)
#   §5.1 사고 시나리오표 S0, §1.2 계통 경계, §2.3 정격 운전조건, §4.3–4.4,
#   §5.4 판정 기준, §7.1 검산, §8 팀 결정 D2·D4·D6·D9.
#
# 구성 (config_schema.md: conditions = 이름 → 입력 매핑)
#   conditions.core_benchmark
#     보고서가 정의한 S0. OECD/NEA 벤치마크 Ex. I-2 조건의 노심·RPV 단독
#     문제로, 입구 유량·온도와 출구 압력을 경계로 준다. 벤치마크 결과와
#     비교하고, 벤치마크형 과도 S1–S3의 초기상태로 쓴다.
#   conditions.system_loop
#     순환기·덕트·SG-0 열침원을 포함한 1차계통 폐루프 정상상태 (PSID 분포).
#     압력손실 K 보정과 계통 과도(S1b 등)의 초기상태에 쓴다.
#   압력 분포는 PSID 절대압 기준이다 (팀 결정 2026-11-26, 보고서 D2). 루프는 하부 플레넘
#   6.3373 MPa(a)이고, 벤치마크 비교 조건만 R1 정의대로 노심 출구 6.39 MPa를 경계로 쓴다.
#   위치는 둘 다 하부(출구) 플레넘(230)이다.
#
# 값은 operation.yaml / geometry.yaml과 같게 적고, 일치 여부는
# tests/inputs/test_scenario_steady_state.py가 검사한다.
# 단위 SI (Pa 절대압, K, kg/s, W). null은 미정이며 0이 아니다.
# 상태 표시: [원문] [계산] [제안] 담당 1 제안·팀 합의 대기, [가정] [미확보]
# =====================================================================

name: steady_state
id: S0
classification: protected          # 보고서 표의 분류 '보호'
priority: 2                        # 개발 우선순위 (보고서 §5.1)
default_condition: core_benchmark  # 보고서 S0 정의. 루프 계산은 system_loop 선택

conditions:
  # -------------------------------------------------------------------
  # 벤치마크 Ex. I-2 조건 (노심·RPV 단독) — R1 Table I.8, I.10, I.11
  # -------------------------------------------------------------------
  core_benchmark:
    description: 정격 정상상태, OECD/NEA MHTGR-350 Phase I Ex. I-2 경계조건
    benchmark_exercise: Phase I Exercise 2 (R1 §II.1.1.2, 지정 출력밀도의 열수력 단독 계산)
    benchmark_subcases:                    # 둘 다 Type I 우회 11 %. 2a는 우회 없음, 2d는 Type II
      2b: {properties: fixed, property_table: "R1 Table AIV.1"}
      2c: {properties: variable, property_table: "R1 Appendix IV (온도·조사량 의존)"}
    default_subcase: 2b                    # [제안] 고정 물성으로 먼저 맞춘 뒤 2c. 2c는 블록별 조사량 맵(참가자 한정)이 필요
    domain:
      nodes: [130, 140, 150, 200, 210, 220, 230]   # RV 입구 → riser → 상부 플레넘 → 노심 3유로 → 하부 플레넘
      heat_structures: [HS-01, HS-02, HS-03, HS-04, HS-05, HS-06, HS-07, HS-08, HS-09, HS-10]
      closed_junctions: [J20, J23]                 # SCS 분기 (SLSV 닫힘, 누설 무시 [가정])
      # 계산 영역 밖: cold annulus 120, hot duct 240, SG, 순환기, SCS

    inlet_boundary:
      junction: J03                  # 120 → 130 (RV 입구)
      mass_flow_kg_s: 157.1          # [원문] R1 Table I.8 #3
      temperature_K: 532.15          # [원문] 259.0 °C, R1 Table I.8 고정 경계조건
    outlet_boundary:
      junction: J12                  # 230 → 240 (하부 플레넘 → hot duct)
      pressure_Pa: 6390000           # [제안] R1 Table I.8 #4 '출구 압력' 6.39 MPa를 절대압으로 해석 (M06)
      pressure_location: lower_plenum
      # INL R4(2016)도 출구 6.39 MPa를 경계로 썼다. R3(2012)는 6.39 MPa를 입구에 걸어 출구 6.36 MPa,
      # 유량 154.33 kg/s를 얻었다 (R3 Table IV) — 비교 시 경계조건 차이에 주의

    reactor:
      thermal_power_W: 350000000     # [원문] 고정 출력
      power_mode: specified_total
      power_distribution: uniform    # [가정] 사용자 결정 2026-11-26 (operation.yaml reactor.power_distribution).
                                     #   R1 Ex. 2 지정 분포 파일(OECD-MHGTR350-power.inp)은 참가자 한정이라 대신 씀

    bypass_model: type_I_fixed_fraction   # [원문] R1 Table I.11, 합 11 %. geometry.yaml core.channels.bypass (보고서 D4)
    helium_properties: data/properties/r1_benchmark_properties.yaml#helium   # R1 Table AIV.13 (provider는 담당 2)
    solid_properties: data/properties/r1_benchmark_properties.yaml           # 2b: fixed_properties_ex2ab, 2c: 온도·조사량 식
    rccs:
      model_level: RCCS-0
      boundary_temperature_K: 303.15      # [원문] 30 °C, ε 0.80, r 4.633 m, 하부 단열
    shutdown_cooling_operating: false   # SCS 대기

    initial_guess: operation.initial_distribution   # 지점 3·5·7의 압력·온도

    outputs:                               # 보고서 §5.1 S0 주요 출력
      - fuel_temperature_max_K             # 최대 연료온도와 위치
      - core_outlet_temperature_K          # 하부 플레넘 혼합 온도
      - channel_mass_flow_kg_s             # 평균·고온·우회 유량 분배
      - pressure_drop_plenum_to_plenum_Pa  # 상부(150) → 하부(230) 플레넘
      - rpv_temperature_K                  # RPV 측벽 온도 분포와 최댓값
      - rccs_heat_removal_W                # RCCS 경계 열손실

    comparison:                            # 코드 결과와 비교할 참고값 (판정 기준 아님). 출처 목록: data/validation/benchmark/manifest.yaml
      core_outlet_temperature_K: 960.15    # [원문] ≈687 °C, R1 Table I.8 결과값
      # 아래는 INL RELAP5-3D 결과 (R3 Table IV, 3링 모델). 코드 결과이지 측정값이 아니고 경계조건이 다르다
      core_pressure_drop_Pa: 19950         # 입구 6.39 → 출구 6.36 MPa
      fuel_temperature_max_K: 1261.15      # 988 °C, 부수로 평균 (TRISO 모델 없음 → 실제 커널 최고온도는 더 높음)
                                           #   R3는 R1 지정 출력분포(상부 첨두)를 썼다. 균일 분포 결과는 이보다 낮게 나와 직접 비교 불가
      core_barrel_temperature_avg_K: 595.15   # 322 °C
      code_to_code_results: null           # [미확보] Ex. 2 전체 참가자 비교 결과 (공개 여부 미확인)

    acceptance:
      rpv_temperature_max_K: 643.15        # [원문] 370 °C, 비 LOFC 사건 (R9 §4.2.8, 보고서 D9)

  # -------------------------------------------------------------------
  # 1차계통 폐루프 정격 정상상태 — PSID 분포 (R19 Table 5.1-1, 5.3-5)
  # -------------------------------------------------------------------
  system_loop:
    description: 순환기·cross duct·SG-0 열침원을 포함한 폐루프 정격 정상상태
    domain:
      nodes: [100, 110, 120, 130, 140, 150, 200, 210, 220, 230, 240, 300, 310, 320, 330, 340, 350]
      heat_structures: [HS-01, HS-02, HS-03, HS-04, HS-05, HS-06, HS-07, HS-08, HS-09, HS-10, HS-11]
      closed_junctions: [J20, J21, J22, J23]   # SCS 대기, SLSV 닫힘 (누설 무시 [가정])
      # SG-0에서는 SG 2차측(500, J90·J91)과 전열관 HS-12를 계산하지 않는다.
      # SG 용기 HS-13의 외측 공동 경계는 미확보라 단열로 둔다 [가정].

    pressure_closure:                      # interface_spec §5 정상 초기화 제약
      type: pressure                       # p_sys − p_sys_initial = 0 (재고량 제약 대신, 팀 결정 D2). 체적은 #31·#32에서 확보,
                                           #   정상해 재고 2,547.8 kg을 R22 2,585 kg과 비교만 한다
      location: lower_plenum
      pressure_Pa: 6337300                 # PSID 절대압 분포 (팀 결정 D2, operation.yaml primary.initial_pressure_Pa)
      replaced_residual_id: lower_plenum.mass   # 교체할 종속 국부 질량식 ID (담당 5 builder 지정, 2026-11-27).
                                           #   p_sys 소유 플레넘의 질량식. 과도에서는 원래 식으로 되돌린다

    circulator:
      boundary_type: prescribed_mass_flow  # 팀 결정 2026-11-26. 성능곡선·관성 미확보 (M09) → 유량 지정, 승압은 결과
      mass_flow_kg_s: 157.1
      heat_to_helium_W: 3100000            # [원문] 순환기 입열 3.1 MW
      rotation_rate_rad_s: 649.26          # 기록용. 유량 지정 방식에서는 쓰지 않음
    mlsv: open

    sg_heat_sink:                          # 팀 결정 2026-11-26 (operation.yaml boundaries.sg_heat_sink)
      model_level: SG-0
      mode: fixed_temperature_liquid_water # 2차측 = 일정량·일정 온도의 액체 물. 상변화·2차측 유동 없음
      water_temperature_K: 466.15          # [제안] 193 °C (급수 온도). 확인 필요
      nodes: [310, 320]                    # 열을 빼는 He 측 셀: Q_i = U·A_i·(T_He,i − T_water)
      calibrate: overall_U_W_m2K           # 정상해에서 U를 보정 (K 보정과 함께)
      calibration_target_helium_outlet_K: 528.15   # [원문] SG He 출구 255 °C → 제거열 ≈ 352.2 MW가 결과로 나옴
      # 물 온도가 일정하고 U가 정해지면 제거열이 He 온도에 따라 정해지므로 정상해가 잘 정의된다
      # (열량을 직접 지정하면 노심·순환기 입열과 정확히 같아야만 정상해가 있다).

    reactor:
      thermal_power_W: 350000000
      power_mode: specified_total
      power_distribution: uniform          # [가정] 사용자 결정 2026-11-26 (operation.yaml reactor.power_distribution)

    bypass_model: type_I_fixed_fraction
    loss_calibration: geometry.pressure_loss_calibration   # 이 정상해로 연결부 K를 보정 (보고서 식 7)
      # 결과는 config/calibration/s0_pressure_loss_K.yaml (python main.py --calibrate, 담당 5 2026-11-27).
      # 실행 때 --calibration으로 넘기며, 이 조건과 파일에 기록한 입력 해시의 형상에만 유효하다 (바뀌면 다시 보정)
    helium_properties: data/properties/r1_benchmark_properties.yaml#helium   # 팀 결정: 전 계통 R1 값
    rccs:
      model_level: RCCS-0
      boundary_temperature_K: 303.15
    shutdown_cooling_operating: false   # SCS 대기

    initial_guess: operation.initial_distribution

    outputs:
      - station_pressure_Pa                # 지점 ①~⑬ 압력 분포
      - station_temperature_K
      - channel_mass_flow_kg_s
      - circulator_pressure_rise_Pa        # 유량 지정 시 결과값
      - sg_heat_removal_W
      - rccs_heat_removal_W
      - rpv_temperature_K
      - helium_inventory_kg                # 정상해에서 유도한 재고량
      - fuel_temperature_max_K

    comparison:                            # PSID 정격값 (판정 기준 아님)
      sg_inlet_pressure_Pa: 6320000        # [원문]
      circulator_inlet_pressure_Pa: 6290000  # [원문]
      circulator_pressure_rise_Pa: 91000   # [원문]
      core_inlet_temperature_K: 532.15     # [원문] 259 °C (PSID 258.6–259)
      sg_heat_removal_W: 352200000         # [원문]
      helium_inventory_kg: 2585            # [원문] R22, 비교 기준 (사용자 결정 2026-11-27). 노드 체적은 #31·#32에서 확보.
                                           #   정상해 재고는 유로 체적만 세므로 정체 공간(배럴 간극·UPTPS 위)을 더해 비교
      # PSID의 RCCS 887 kW, RPV 벽 222/216 °C는 외기 21 °C 실제 플랜트 값이라
      # 30 °C 고정 경계인 RCCS-0 결과와 직접 비교하지 않는다 (operation.yaml reference.psid_R19).

    acceptance:
      rpv_temperature_max_K: 643.15        # 370 °C (R9 §4.2.8)

# ---------------------------------------------------------------------
# 풀이 방법 [제안] (담당 5)
# ---------------------------------------------------------------------
solution:
  method: solve_steady_state       # ydot = 0 Newton (system/simulation.py solve_steady)
  fallback: pseudo_transient       # [미구현] 정상 폐합(p_sys − p0)·U 보정 계는 그대로 적분할 수 없어 과도 계로 따로 구성해야 함
  verification: 정상해를 교체 전 과도 잔차에 ydot = 0으로 넣어 다시 확인 (interface_spec §5)
  jacobian: sparse_finite_difference   # F_y·F_ydot 비영 패턴(초기 추정값에서 한 번) + 색칠 유한차분
  newton: {max_iter: 30, rtol: 1.0e-9, atol: 1.0e-10}   # 척도 잔차 ∞-노름 기준 (solvers.newton)
  acceptance:
    scaled_residual_max: 1.0e-6    # 정상해와 과도 잔차 재확인 모두 (잔차 척도 = Component residual_scales)
  hold_transient:                  # 검증된 정상해에서 일치 초기화 후 무외란 DASSL 유지 — 정상 유지·전역 질량/에너지 수지 확인
    t_end_s: 10.0                  #   데모용 config/solver.yaml(0–5 s)과 별개
    dt_initial_s: 0.05
    rtol: 1.0e-5
    atol: 1.0e-5
    max_step_s: 5.0
    max_order: 5
  convergence_R1_Table_II1:        # 벤치마크 권장 수렴 기준 (core_benchmark)
    local_temperature_delta_K: 0.1
    local_flow_delta_kg_s: 0.1

# ---------------------------------------------------------------------
# 실행 전에 채워야 할 입력 (현재 S0 실행을 막는 항목)
# ---------------------------------------------------------------------
missing_inputs:
  # 노심 출력분포는 균일 분포로 가정해 해소 (2026-11-26). 고온채널 첨두계수 1.0
  - {item: "헬륨 물성 provider (식은 data/properties/r1_benchmark_properties.yaml에 확보)", owner: 2, conditions: [core_benchmark, system_loop]}
  - {item: 마찰·형상손실·대류 열전달 상관식, owner: "2/3", conditions: [core_benchmark, system_loop]}
  - {item: "블록별 조사량(fluence) 맵 — Ex. 2c 가변 물성용 (R1 Fig. I.12 번호, 참가자 한정 파일)", owner: "1/3", conditions: [core_benchmark]}
  # 비연료 블록 유로면적은 PSID 값으로 확보해 geometry.yaml에 반영 (2026-11-26, CRE 유로 치수만 연료와 같게 가정)
  - {item: "Ex. 2 전체 참가자 비교 결과 (현재 INL R3·R4만 확보)", owner: 1, conditions: [core_benchmark]}
  # M08 SG–노심 고도차는 보고서 판 1.1 §3.4로 확보해 geometry.yaml에 반영 (2026-11-26)
  # M11 SG He 측 최소 자유유로면적·D_h·환형 상승부 단면은 R19 Table 5.2-2·5.3-8로 계산해 geometry.yaml에 반영 (2026-11-27, #31)
  # M07 cross duct 길이는 5.52 m로 결정 (사용자 2026-11-27, PSID 수평 2구간). M10 110·350 분배는 R19 Fig. 5.3-4로 채움 (#32)
  - {item: "SG-0 물 온도 확인 (제안 193 °C = 급수 온도)", owner: "1/4", conditions: [system_loop]}
  # 정상 초기화에서 교체할 질량식 ID는 builder가 lower_plenum.mass로 지정 (2026-11-27, pressure_closure.replaced_residual_id)
