# =====================================================================
# S0 실행용 임시 가정값 (provisional) — 원문 값이 아니다
# =====================================================================
# geometry.yaml에서 null(미확보)인 입력을 S0 계산을 돌리기 위해 임시로 채운다.
# builder는 이 파일을 명시적으로 넘길 때만(`--assumptions`) 이 값을 쓰고, 결과 메타데이터에 이 파일과
# 항목을 모두 기록한다. 이 파일 없이 실행하면 누락 입력 목록과 함께 실패한다.
# 각 항목은 원문 자료가 확보되면 geometry.yaml에 넣고 여기서 지운다.
#
# 이력
#   2026-11-27 처음 작성: 우회 D_h·shape, SG He D_h, 110·300·330·340·350 체적·340 유로 [가정]
#   2026-11-27 (#31): R19(PSID) Table 5.2-2·5.3-8, Fig. 5.2-8·5.3-9·5.3-10과 R1 Table I.12로 계산·도면해석한
#     값을 geometry.yaml에 넣고 여기서 지웠다 (우회 D_h 8.2/4.7 mm, SG He D_h 0.0577 m, 300·330·340).
#     남은 것은 SG 용기 상부 영역(48.85 m³ [계산])을 110과 350에 나누는 비율뿐이다.
# =====================================================================

meta:
  status: provisional
  created: 2026-11-27
  owner: "담당 1 (입력), 담당 5 (실행)"
  note: "둘 다 저온 He(≈5.7 kg/m³)라 재고량 합에는 영향이 없고, 110·350 사이 수송 지연만 달라진다"

geometry:                                  # geometry.yaml 위에 깊게 덮어쓴다 (null만 채움)
  flow_network:
    nodes:
      mc_discharge_plenum:                 # 110: 순환기 토출 플레넘 (R19 지점 1, '용기 상단 플레넘')
        volume_m3: 24.425                  # [가정] 상부 영역 48.85 m³ × ½ (경계 치수 미확보, M10)
      mc_inlet_mlsv:                       # 350: 순환기 입구 덕트·MLSV (R19 지점 12–13). 밸브 모델 미구현 → 무손실 플레넘
        volume_m3: 24.425                  # [가정] 상부 영역 48.85 m³ × ½
