# ---------------------------------------------------------------------
# 원자로공동냉각계통 (RCCS, Role 4)
# ---------------------------------------------------------------------
rccs:
  # RCCS-0: 고정 온도 경계 (1차 구현). 경계 온도 30 °C는 시나리오 입력
  boundary:
    node_id: 930
    radius_m: 4.633                # [원문] R1 Table I.10
    top_z_m: 18.6813               # [원문]
    emissivity: 0.80               # [원문] R1 §I.8.1
    bottom: adiabatic              # 하부 단열
    cavity_air: stagnant_1atm
  # RCCS-1 패널 참고값 — 1차 구현에서는 사용하지 않음. 두 출처의 형상이 다르다.
  panel_reference:
    psid:                          # R19 §5.5.4.1
      panels: 12                   # 4 사분면 × 3
      upper_plenum_height_m: 4.6
      heated_height_m: 17.0
      material: carbon_steel
    design_description:            # R23 §2.3, Table F-3
      riser_tubes: 227
      tube_outer_m: [0.0508, 0.254]   # 2 × 10 in
      tube_wall_m: 0.0047625          # 0.1875 in
      height_m: 19.2                  # 63 ft
      air_flow_area_m2: 2.291         # 24.66 ft²
      hydraulic_diameter_m: 0.0707    # 0.232 ft
      loss_coefficient_K: 9.83
      emissivity: 0.8
    chimney_height_m: null            # 상충: 노심 상단 위 26 m / 지상 14 m(PSID) / 지상 29 m(R23)

# ---------------------------------------------------------------------
# 정지냉각계통 (SCS) — S1b에서만 사용, 그 외 시나리오에서는 상실 가정
# ---------------------------------------------------------------------
scs:
  nodes:
    sche_shell:
      node_id: 400
      type: pipe
      cells: 2
      flow_area_m2: 1.64            # [계산·근사]
      length_m: 4.0                 # [가정] ≈4 m, 하향
      volume_m3: null
    scs_circulator:
      node_id: 410
      type: pump                    # 2단 축류, 149 kW, 10,000 rpm
    slsv:
      node_id: 420
      type: valve                   # 정상운전 시 닫힘
  sche_tubes:
    count: 43
    rows: 8
    outer_diameter_m: 0.0222
    wall_thickness_m: 0.00254
    effective_length_m: 46.3
    material: 2.25Cr-1Mo

# ---------------------------------------------------------------------
# 경계 노드 (9xx). 경계값(온도·압력·유량)은 operation/scenario 입력
# ---------------------------------------------------------------------
boundaries:
  feedwater_tdv: {node_id: 900, medium: water}
  main_steam_tdv: {node_id: 910, medium: water}
  scs_water_tdv: {node_id: 920, medium: water}
  rccs_boundary: {node_id: 930, medium: thermal}

# ---------------------------------------------------------------------
# 재료 (열구조체용). 온도·조사량 의존 물성 식은 data/properties/r1_benchmark_properties.yaml,
# 비조사 표 값은 data/properties/graphite.csv·helium.csv (R1 Appendix IV)
# ---------------------------------------------------------------------
materials:
  H-451:            {density_kg_m3: 1850, emissivity: 0.85, source: "R1 Tables AIV.2-3", k_and_cp: temperature_fluence_dependent}
  graphite_2020:    {density_kg_m3: 1780, emissivity: 0.85, source: "R1 Tables AIV.4-5", k_and_cp: temperature_fluence_dependent}
  Alloy_800H:       {density_kg_m3: 7800, conductivity_W_mK: 17.8, cp_J_kgK: 515, emissivity: 0.85,
                     source: "R1 Table AIV.9"}
  SA533B_Cl1:       {density_kg_m3: 7500, conductivity_W_mK: 40.0, cp_J_kgK: 580, emissivity: 0.85,
                     effective_emissivity: 0.74, source: "R1 Table AIV.12"}
  2.25Cr-1Mo:       {density_kg_m3: null, conductivity_W_mK: null, cp_J_kgK: null, source: null}   # [미확보]
  ceramic:          {density_kg_m3: 1310, cp_J_kgK: 1100, emissivity: 0.85, source: "R1 Table AIV.10",
                     conductivity: temperature_dependent}    # MCSS 위 세라믹 타일 (Ceraform 1000)
  fiber_insulation: {density_kg_m3: 128, cp_J_kgK: 1130, emissivity: 0.85, source: "R1 Table AIV.11",
                     conductivity: temperature_dependent}    # cross duct·UPTPS 단열재 (Kaowool)
  fuel_compact:     {density_kg_m3: null, conductivity_W_mK: null, cp_J_kgK: null, source: null}   # Role 3
  surface_roughness_m: 0.0          # [원문] R1 §I.8.1 매끈한 관 가정
